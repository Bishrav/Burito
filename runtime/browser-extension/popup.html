<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Burito Brave Tabs</title>
    <style>
      body { min-width: 220px; margin: 0; padding: 16px; color: #e1e2ec; background: #10131a; font: 14px system-ui, sans-serif; }
      h1 { margin: 0 0 8px; color: #00dce6; font-size: 14px; }
      #count { font: 600 28px ui-monospace, monospace; }
      p { margin: 8px 0 0; color: #b9cacb; font-size: 12px; }
      button { margin-top: 12px; padding: 7px 9px; color: #00373a; background: #00f2fe; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
      #status { min-height: 32px; }
    </style>
  </head>
  <body>
    <h1>BURITO // BRAVE ACCESS</h1>
    <div id="count">…</div>
    <p>Open tabs in this Brave profile.</p>
    <button id="enable">Enable tab labels</button>
    <button id="enable-site">Enable this site</button>
    <button id="enable-all">Enable all websites</button>
    <button id="enable-copy">Enable clipboard copy</button>
    <p id="status">Clipboard permission only lets Burito write exact text after a separate per-copy approval. It cannot read your clipboard.</p>
    <script src="popup.js"></script>
  </body>
</html>
